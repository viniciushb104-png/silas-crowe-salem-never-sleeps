<style>:root{--gold:#dfb477;--pale:#f0d9b7;--wine:#7d293e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--pale);background:#0b0810;font-family:Georgia,serif}button,a{font:inherit}button{cursor:pointer;color:var(--pale);border:1px solid #b98b57;background:#2c1827;padding:12px 18px;border-radius:6px}button:hover,button:focus-visible{background:#703049}button:disabled{opacity:.42;cursor:not-allowed}a{color:#f3c989}.hide{display:none!important}#intro{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center}#intro iframe{position:absolute;width:100%;height:100%;border:0;inset:0;background:black}#intro .introBtns{position:absolute;z-index:2;bottom:18px;right:18px;display:flex;gap:9px}#intro .notice{position:absolute;z-index:2;left:15px;top:15px;background:#130b18cc;border:1px solid #946940;border-radius:7px;padding:9px;max-width:min(460px,85vw);font-size:13px}#intro button{background:#1e1420dc}#title{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 17%,#b1764a 0,#522c39 10%,#1a1220 36%,#09070e 75%)}.mist{position:absolute;bottom:0;width:100%;height:65%;background:linear-gradient(180deg,transparent,#240f1ae0),repeating-linear-gradient(90deg,transparent 0 100px,#08060b 110px 130px,transparent 140px 240px);opacity:.75;pointer-events:none}.moon{position:absolute;right:10%;top:8%;width:min(16vw,160px);aspect-ratio:1;border-radius:50%;background:#f0c18b;box-shadow:0 0 90px #df986288}.spires{position:absolute;bottom:0;width:100%;height:32%;background:repeating-linear-gradient(105deg,#090911 0 110px,#19121b 111px 164px,#090911 165px 230px);clip-path:polygon(0 50%,8% 44%,12% 15%,16% 43%,24% 42%,29% 0,34% 40%,42% 45%,48% 20%,53% 43%,62% 34%,66% 5%,71% 42%,80% 40%,85% 20%,89% 45%,100% 32%,100% 100%,0 100%)}.content{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px 18px 65px;text-align:center}h1{font-size:clamp(38px,8vw,91px);margin:0;color:#f1c484;letter-spacing:.09em;text-shadow:0 6px 20px #000,0 0 50px #7b3638}h2{color:#f1c484}p{line-height:1.6}.subtitle{font-size:clamp(14px,2vw,23px);letter-spacing:.4em;text-transform:uppercase;margin:5px 0 18px}.tagline{max-width:600px;font-style:italic;color:#dbc0ab}.menu{display:grid;grid-template-columns:repeat(2,minmax(180px,260px));gap:12px;margin-top:18px}.menu button{font-size:17px;background:#180f1ecb;border:1px solid #b89160;min-height:56px;box-shadow:0 6px 25px #0008}.menu button.primary{background:#7a2a3e}.footer{margin-top:25px;font-size:12px;color:#bea589}#panel{position:fixed;inset:0;background:#06060be8;z-index:5;display:none;align-items:center;justify-content:center;padding:15px}#panel.show{display:flex}.panelBody{max-width:760px;width:100%;max-height:87dvh;overflow:auto;border:2px solid #c09664;background:linear-gradient(125deg,#321a2a,#11111b);border-radius:12px;padding:26px;box-shadow:0 0 55px #000}.panelBody .close{float:right}.tile{border:1px solid #795a49;padding:12px;margin:9px 0;border-radius:8px;background:#1e1520}.locked{opacity:.7}.mini{font-size:13px;color:#c7b29f}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}@media(max-width:550px){.menu{grid-template-columns:1fr;width:min(360px,100%)}.menu button{min-height:47px;font-size:15px}.subtitle{letter-spacing:.15em}#intro .introBtns{bottom:10px;right:10px}.panelBody{padding:18px}}#menuVideoLayer{position:absolute;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 75% 22%,#71412e,#120c17 60%)}#menuBgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.78) saturate(1.03);opacity:0;transition:opacity .9s ease}#menuVideoLayer.ready #menuBgVideo{opacity:1}#menuVideoLayer:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08071188,#10071233,#09071077),linear-gradient(180deg,#09070d44,transparent 35%,#09070dbb);pointer-events:none}#title.video-ready .moon,#title.video-ready .mist,#title.video-ready .spires{display:none}#title .content{position:relative;z-index:2}#menuPlayback{position:relative;z-index:2;margin-top:12px;font-size:12px;opacity:.85;background:#180f1bbb;padding:8px 12px}#menuBgVideo:focus{outline:none}@media(max-width:700px){#menuBgVideo{object-position:43% center}#title .content{padding-top:65px;padding-bottom:55px}#title.video-ready .menu button{background:#170f1dc9;backdrop-filter:blur(5px)}}</style></head>
<body><section id="intro" class="hide" aria-label="Abertura cinematográfica"><div id="video"></div><div class="notice">🎷 Abertura oficial · videoclipe de 05:19 a 10:27. O áudio pode exigir um toque por restrições do navegador.</div><div class="introBtns"><button id="restartIntro">↻ Reiniciar</button><button id="skipIntro">⏭ Pular abertura</button></div></section>
<main id="title"><div id="menuVideoLayer" aria-hidden="true"><video id="menuBgVideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture><source src="./assets/videos/silas-main-menu-loop.mp4.mp4" type="video/mp4"></video></div><div class="moon"></div><div class="mist"></div><div class="spires"></div><section class="content"><div style="font-size:32px">🎙️ 🦇 🎷</div><h1>SILAS CROWE</h1><div class="subtitle">Salem Never Sleeps</div><p class="tagline">“Os mortos não mentem menos que os vivos. Apenas tiveram mais tempo para ensaiar.”</p><nav class="menu" aria-label="Menu principal"><button id="new" class="primary">✦ Novo jogo</button><button id="continue">↪ Continuar jornada</button><button id="musics">♫ Músicas</button><button id="videos">▣ Vídeos</button><button id="treasures">♛ Tesouros de Salem</button><button id="history">📜 Curiosidades de Salem</button><button id="credits">✧ Créditos</button><button id="opening">▶ Rever abertura</button></nav><button id="menuPlayback" type="button" aria-label="Reproduzir animação do menu">▶ Reproduzir fundo animado</button><div class="footer">ASAS DO MEDO GAMES · Versão experimental 0.3 · Exploração 2,5D</div></section></main>
<div id="panel" role="dialog" aria-modal="true"><div class="panelBody"><button class="close" id="closePanel">✕ Fechar</button><h2 id="panelTitle"></h2><div id="panelText"></div><div id="panelActions" class="actions"></div></div></div>
<script>(()=>{'use strict';const $=s=>document.getElementById(s),saveKey='silas-salem-25d-v1',seenIntro='silas-intro-seen-v1';let vidTimer=null,showing=false;const videoURL='https://www.youtube-nocookie.com/embed/AK8M-jhoP3o?start=319&end=627&autoplay=1&playsinline=1&rel=0';function progress(){try{return JSON.parse(localStorage.getItem(saveKey))}catch{return null}}function exitIntro(){clearTimeout(vidTimer);$('video').replaceChildren();$('intro').classList.add('hide');showing=false;sessionStorage.setItem(seenIntro,'1')}function playIntro(){exitIntro();showing=true;$('intro').classList.remove('hide');let frame=document.createElement('iframe');frame.title='Silas Crowe — abertura oficial';frame.src=videoURL;frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';$('video').append(frame);vidTimer=setTimeout(exitIntro,309000)}$('opening').onclick=playIntro;$('restartIntro').onclick=playIntro;$('skipIntro').onclick=exitIntro;function start(){if(progress())return panel('Nova jornada','Uma jornada salva já existe neste navegador. Iniciar um novo jogo apagará o progresso atual.','', [['Cancelar',close],['Recomeçar Salem',()=>{localStorage.removeItem(saveKey);location.href='./salem-25d.html'}]]);location.href='./salem-25d.html'}function close(){$('panel').classList.remove('show')}function panel(title,html,extra='',buttons=[]){$('panelTitle').textContent=title;$('panelText').innerHTML=html+extra;$('panelActions').replaceChildren();buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('panelActions').append(b)});$('panel').classList.add('show')}$('closePanel').onclick=close;$('panel').onclick=e=>{if(e.target===$('panel'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('panel').classList.contains('show')?close():showing&&exitIntro()}});$('new').onclick=start;$('continue').onclick=()=>progress()?location.href='./salem-25d.html':panel('Continuar jornada','Ainda não existe progresso salvo. Inicie uma nova investigação para desbloquear esta opção.','',[['Novo jogo',start]]);function tile(title,content,locked=false){return '<div class="tile'+(locked?' locked':'')+'"><b>'+title+'</b><p>'+content+'</p></div>'}
$('musics').onclick=()=>panel('♫ Fonógrafo de Salem',tile('Abertura cinematográfica','A trilha está presente no videoclipe oficial de Silas Crowe. Assista à abertura para ouvi-la.')+tile('Fonógrafo da Cidade — em produção','As faixas serão liberadas conforme casos e apresentações musicais forem implementados.',true),'',[['Assistir abertura',()=>{close();playIntro()}]]);
$('videos').onclick=()=>panel('▣ Cinema das Sombras',tile('Videoclipe oficial', 'Trecho utilizado na abertura: 05:19–10:27. <a target="_blank" rel="noopener noreferrer" href="https://youtu.be/AK8M-jhoP3o?t=319">Assistir no YouTube</a>')+tile('Cenas e curtas desbloqueáveis','Espaço reservado para futuros vídeos narrativos conquistados durante as investigações.',true));
$('treasures').onclick=()=>{let p=progress(),n=(p?.notes||[]).length;panel('♛ Tesouros de Salem',tile('Caderno de Memórias','Observações reunidas na cidade: <b>'+n+'</b>.')+tile('Relíquias e troféus','Vitrine preparada para recompensas futuras de casos, missões e descobertas históricas.',true),'',[['Explorar Salem',()=>location.href='./salem-25d.html']])};
$('history').onclick=()=>{let p=progress(),n=(p?.notes||[]).length;panel('📜 Curiosidades de Salem',tile('Os julgamentos de 1692–1693','Pessoas reais sofreram acusações, prisões e execuções. As aparições e mistérios sobrenaturais são ficcionais.')+(n?tile('Salem Town e Salem Village','Salem Village era distinta de Salem Town; a região histórica de Salem Village corresponde à atual Danvers.'):tile('Salem Town e Salem Village','Desbloqueie sua primeira observação investigando na cidade.',true))+(n>=3?tile('A história marítima','Salem possui um patrimônio histórico marítimo importante, além da memória dos julgamentos.'):tile('A história marítima','Registre pelo menos três observações para liberar esta curiosidade introdutória.',true))+'<p class="mini">Conteúdo introdutório. O Codex dentro da cidade inclui links para consulta histórica.</p>')};
$('credits').onclick=()=>panel('✧ Créditos',tile('Criação e direção','Vinicius Diniz')+tile('Produção','Asas do Medo Games')+tile('Desenvolvimento','Projeto desenvolvido com assistência de inteligência artificial; programação e artes em evolução.')+tile('Universo','Silas Crowe: Salem Never Sleeps — uma obra de ficção sobrenatural inspirada na história de Salem.')+tile('Videoclipe de abertura','Obra audiovisual fornecida pelo criador e reproduzida a partir do YouTube.')+'<p class="mini">Créditos adicionais de colaboradores, trilhas e licenças deverão ser incorporados conforme as produções forem integradas.</p>');
const menuVid=$('menuBgVideo'),menuLayer=$('menuVideoLayer'),menuPlay=$('menuPlayback');function tryMenuVideo(){if(!menuVid)return;menuVid.muted=true;const p=menuVid.play();if(p&&p.catch)p.catch(()=>{menuPlay.textContent='▶ Ativar animação do menu'})}menuVid.addEventListener('playing',()=>{menuLayer.classList.add('ready');$('title').classList.add('video-ready');menuPlay.textContent='Ⅱ Pausar animação'});menuVid.addEventListener('error',()=>{menuPlay.textContent='Vídeo indisponível · fundo estático';menuPlay.disabled=true});menuPlay.onclick=()=>{if(menuVid.paused)tryMenuVideo();else{menuVid.pause();menuPlay.textContent='▶ Reproduzir animação'}};document.addEventListener('visibilitychange',()=>{if(document.hidden)menuVid.pause();else if(!showing)tryMenuVideo()});tryMenuVideo();if(!sessionStorage.getItem(seenIntro))playIntro();
})();</script></body></html>
