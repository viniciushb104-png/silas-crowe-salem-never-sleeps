<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Silas Crowe — Arquivo 001</title>
<style>
:root{--gold:#e6b65c;--wine:#8b2535;--ink:#0d0a12;--paper:#e9d5ae}*{box-sizing:border-box}body{margin:0;background:#08070b;color:var(--paper);font-family:Georgia,serif}button{font:inherit;cursor:pointer;background:#241523;border:1px solid #a57646;color:#f3d6a4;border-radius:8px;padding:10px 16px}button:hover,button:focus{background:#643040}button:disabled{opacity:.38;cursor:default}header{height:65px;background:linear-gradient(90deg,#130b12,#3a101e,#130b12);border-bottom:2px solid #9d6338;display:flex;align-items:center;justify-content:space-between;padding:8px 18px}header strong{font-size:clamp(15px,3vw,26px);color:#f2c475;letter-spacing:2px}header small{font-family:sans-serif;color:#cbb794}#game{position:relative;margin:10px auto;width:min(1100px,100%);height:min(64vw,560px);min-height:355px;overflow:hidden;border:2px solid #7b4e30;background:#100e17}#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 11%,#b67a52 0,#4b2540 14%,#191024 39%,#080813 78%)}#moon{position:absolute;right:10%;top:7%;width:90px;height:90px;border-radius:50%;background:#f1c17a;box-shadow:0 0 70px #bb793f77}#windows{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 150px,#05050a 151px 168px,transparent 169px 180px),linear-gradient(180deg,transparent 0 58%,#140e18 59%)}.window{position:absolute;top:17%;width:12%;height:53%;border:9px solid #140d16;background:linear-gradient(180deg,#ad7149 0%,#3a1930 52%,#0b0a10 100%);box-shadow:inset 0 0 20px #ed9e5b66}.window:before{content:'✦';font-size:42px;position:absolute;top:14%;left:30%;color:#d5a16c}.w1{left:13%}.w2{right:18%}#floor{position:absolute;bottom:0;width:100%;height:29%;background:repeating-linear-gradient(0deg,#24141b 0 27px,#492a2b 28px 30px);border-top:12px solid #573324}#stage{position:absolute;left:0;bottom:24%;width:36%;height:8%;background:#2f1722;border-top:5px solid #c28f4b}#curtain{position:absolute;top:0;left:0;width:100%;height:12%;background:repeating-linear-gradient(90deg,#500f22 0 28px,#230914 29px 55px);border-bottom:5px solid #b58346;border-radius:0 0 40% 30%}#clubName{position:absolute;top:14%;left:30%;font-size:clamp(14px,2.8vw,34px);color:#d7ae6b;text-shadow:0 0 15px #ff974a;font-style:italic}#silas{position:absolute;bottom:26%;left:15%;width:115px;height:205px;transform:translateX(-50%);filter:drop-shadow(0 5px 7px #000);transition:left .045s linear;z-index:3}#silas svg{width:100%;height:100%}#silas.flip svg{transform:scaleX(-1)}.object{position:absolute;bottom:27%;border:0;background:none;padding:0;font-size:39px;filter:drop-shadow(0 3px 4px black);z-index:2;cursor:pointer}.object:focus{outline:2px solid #ecd190}.object span{display:block;font:12px sans-serif;color:#ffda8f;background:#1b1019c9;padding:3px;border-radius:5px}.object.found span{color:#94eab2}#hud{position:absolute;top:9px;left:10px;background:#130e18dc;border:1px solid #9a6a40;border-radius:7px;padding:8px;font:13px sans-serif;z-index:5}#hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:#170d1ce8;border:1px solid #a86e49;border-radius:8px;padding:8px 14px;white-space:nowrap;font-size:13px;z-index:5}#mobile{position:absolute;bottom:12px;left:12px;display:flex;gap:12px;z-index:6}#mobile button{touch-action:none;font-size:21px;width:50px;height:48px;padding:0;background:#1a121fdd}#actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:6px 10px}.overlay{position:absolute;inset:0;background:#08060ddf;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.panel{border:2px solid #ae7d49;box-shadow:0 0 30px #000;background:linear-gradient(130deg,#281524,#0f1019);width:min(700px,100%);max-height:100%;overflow:auto;border-radius:12px;padding:20px 25px}.panel h1,.panel h2{color:#f2c47a;letter-spacing:1px}.panel p{line-height:1.55}.hidden{display:none!important}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.choices button{flex:1 1 170px}.clue{padding:7px;border-bottom:1px solid #684632}#toast{position:absolute;top:42px;right:10px;padding:12px;background:#221421;border:1px solid #b68a45;display:none;z-index:15;max-width:300px}footer{text-align:center;font-size:12px;color:#a78c75;padding-bottom:12px}@media(max-width:600px){#game{height:68vh;min-height:360px}#silas{width:85px;height:155px}#moon{width:60px;height:60px}#clubName{left:33%;top:15%}.object{font-size:30px}.object span{font-size:10px}#hint{bottom:65px;max-width:96%;white-space:normal;text-align:center}.panel{padding:14px}header small{display:none}}
</style></head>
<body><header><strong>✦ SILAS CROWE ✦</strong><small>SALEM NEVER SLEEPS • ARQUIVO 001 • DEMO</small></header>
<div id="game"><div id="sky"></div><div id="moon"></div><div id="windows"></div><div class="window w1"></div><div class="window w2"></div><div id="floor"></div><div id="stage"></div><div id="curtain"></div><div id="clubName">THE MIDNIGHT CROW</div>
<div id="silas" aria-label="Silas Crowe — representação vetorial provisória"><svg viewBox="0 0 115 205" xmlns="http://www.w3.org/2000/svg"><path d="M55 86 Q-4 35 7 141 Q37 154 50 120M59 86 Q119 29 108 140 Q77 154 61 120" fill="#ded6da" stroke="#8f8b9b" stroke-width="3"/><path d="M43 45 Q12 4 41 8 Q31 23 54 32M73 45 Q103 4 75 8 Q84 22 62 32" fill="#141018" stroke="#c99d5b" stroke-width="2"/><path d="M41 23 Q61 3 80 25L85 41L78 63L38 62L32 42Z" fill="#0f1018"/><ellipse cx="58" cy="50" rx="22" ry="26" fill="#edc7a9"/><path d="M35 41Q48 17 79 29L81 47Q65 34 59 41Q44 32 35 50Z" fill="#121018"/><path d="M41 51h12m12 0h11" stroke="#3294cb" stroke-width="3"/><path d="M51 65Q58 69 66 64" fill="none" stroke="#613541" stroke-width="2"/><path d="M43 76L27 94L18 164L43 151L53 112L64 112L76 152L100 165L86 93L72 76" fill="#15121a" stroke="#ae643e" stroke-width="2"/><path d="M43 80L50 128L67 128L75 80" fill="#862238"/><path d="M50 82L58 88L66 82L58 96Z" fill="#ad3444"/><path d="M44 130L38 198H55L58 143L64 198H80L72 130" fill="#16131a"/><path d="M36 196h22v7H32Zm26 0h22v7H62" fill="#15141b" stroke="#b88d54" stroke-width="2"/><circle cx="59" cy="106" r="2" fill="#e6b65c"/><circle cx="59" cy="118" r="2" fill="#e6b65c"/></svg></div>
<button class="object" id="radio" style="left:45%" data-name="Rádio" aria-label="Investigar rádio">📻<span>Rádio</span></button><button class="object" id="letter" style="left:68%" data-name="Carta" aria-label="Investigar carta">✉️<span>Carta</span></button><button class="object" id="record" style="left:84%" data-name="Disco" aria-label="Investigar disco">💿<span>Disco</span></button>
<div id="hud">🔎 Pistas: <b id="count">0</b>/3 • Caso: A Voz das 3h13</div><div id="hint">A/D ou ←/→ para andar • E para investigar</div><div id="toast"></div><div id="mobile"><button id="left" aria-label="Andar para a esquerda">◀</button><button id="right" aria-label="Andar para a direita">▶</button></div>
<div class="overlay" id="overlay"><div class="panel" id="dialog"></div></div></div>
<div id="actions"><button id="inspect">🔎 Investigar próximo</button><button id="notebook">📓 Caderno</button><button id="talk">🎩 Conversar com Edgar</button><button id="deduce">⚖️ Deduzir</button><button id="save">💾 Salvar</button><button id="reset">↺ Reiniciar</button></div><footer>Protótipo de mecânicas • Silas vetorial provisório • arte final e sprites serão adicionados depois • Asas do Medo Games</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),items=['radio','letter','record'];let x=15,dir=0,found=new Set(),stage=0,closed=false;const savekey='silas-demo-v1';const pos={radio:45,letter:68,record:84};const clues={radio:['Transmissor estranho','O rádio registrou um sinal às 3h13, embora seu interruptor estivesse desligado.'],letter:['Carta sem remetente','O envelope contém a frase: “Vocês ainda não ouviram meu testemunho.”'],record:['Disco riscado','O disco traz três notas destacadas: Dó, Mi♭ e Sol.']};
function write(){localStorage.setItem(savekey,JSON.stringify({x,found:[...found],stage}))}function resume(){try{let d=JSON.parse(localStorage.getItem(savekey));if(d){x=d.x||15;found=new Set(d.found||[]);stage=d.stage||0;return true}}catch{}return false}
function update(){x=Math.max(7,Math.min(93,x));$('silas').style.left=x+'%';$('silas').classList.toggle('flip',dir<0);$('count').textContent=found.size;items.forEach(id=>{$(id).classList.toggle('found',found.has(id));$(id).querySelector('span').textContent=found.has(id)?'✓ '+clues[id][0]:$(id).dataset.name});$('hint').textContent=found.size<3?'A/D ou ←/→: andar • E: investigar • encontre 3 pistas':'3 pistas reunidas! Converse com Edgar e faça a dedução.'}
function modal(title,body,opts=[]){closed=false;$('overlay').classList.remove('hidden');$('dialog').innerHTML='<h2>'+title+'</h2><p>'+body+'</p><div class="choices" id="choices"></div>';opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('choices').appendChild(b)});if(!opts.length){let b=document.createElement('button');b.textContent='Continuar';b.onclick=hide;$('choices').appendChild(b)}}
function hide(){closed=true;$('overlay').classList.add('hidden');update()}
function toast(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function investigate(id){if(!id)return toast('Aproxime-se de um objeto para investigar.');if(Math.abs(pos[id]-x)>13)return toast('Silas precisa chegar mais perto.');let [name,description]=clues[id];found.add(id);write();update();modal('🔎 '+name,description,[['Registrar no caderno',hide]])}
function near(){return items.filter(id=>Math.abs(pos[id]-x)<=13).sort((a,b)=>Math.abs(pos[a]-x)-Math.abs(pos[b]-x))[0]}
function talk(){if(found.size<1)return modal('Edgar — Operador de rádio','“Senhor Crowe, juro que esta noite não aconteceu absolutamente nada de estranho.”');modal('Edgar — Interrogatório','“O aparelho estava desligado. Nem mesmo a tomada estava conectada.”',[['Apresentar a gravação',()=>modal('Edgar — Contradição','“Está bem! Ouvi um piano antes da voz. Mas não conte a ninguém, por favor.”',[['Registrar depoimento',()=>{stage=Math.max(stage,1);write();hide()}]])],['Responder com sarcasmo',()=>modal('Silas Crowe','“Fascinante. É o primeiro aparelho desempregado que conheço trabalhando horas extras.”')],['Ouvir com respeito',()=>modal('Edgar','“Aquela voz parecia triste, Silas. Não parecia uma ameaça. Parecia um pedido.”')]])}
function notebook(){modal('📓 Caderno das Verdades Inconvenientes',items.map(id=>'<div class="clue">'+(found.has(id)?'✓ '+clues[id][0]+': '+clues[id][1]:'🔒 Pista desconhecida')+'</div>').join('')+'<p>Depoimento de Edgar: '+(stage?'Ouviu piano antes da transmissão.':'Ainda não confrontado com uma prova.')+'</p>')}
function deduce(){if(found.size<3||stage<1)return modal('⚖️ Tribunal das Evidências','Ainda faltam elementos. Colete as três pistas e confronte Edgar com o rádio.');modal('⚖️ Tribunal das Evidências','Qual é a interpretação mais sustentada pelas provas?',[['Um fantasma foi provado sem dúvida',()=>modal('Silas','“A hipótese é sedutora, mas não apresentamos uma prova suficiente.”',[['Tentar novamente',deduce]])],['Uma transmissão inexplicada e uma mensagem pedindo testemunho',()=>{stage=2;write();modal('✦ Caso preliminar concluído','“Excelente. Uma conclusão modesta, mas verdadeira. Os mortos agradecem a raridade.”<p>A voz leva Silas aos registros históricos de Salem. O mistério está apenas começando.</p><p><b>FIM DO TESTE • ARQUIVO 001</b></p>',[['Explorar novamente',hide]])}],['Edgar inventou todas as pistas',()=>modal('Silas','“Acusar sem prova? Salem já cometeu esse erro antes.”',[['Tentar novamente',deduce]])]])}
function fresh(){localStorage.removeItem(savekey);x=15;found=new Set();stage=0;write();update();intro()}
function intro(){modal('🎷 A Voz das 3h13','Salem, 3h13. Um rádio desligado transmite a voz de uma mulher: “Vocês ainda não ouviram meu testemunho.”<p>Silas Crowe terá de investigar o clube e descobrir o que pode — e o que ainda não pode — concluir.</p>',[['Iniciar investigação',hide]])}
$('radio').onclick=()=>investigate('radio');$('letter').onclick=()=>investigate('letter');$('record').onclick=()=>investigate('record');$('inspect').onclick=()=>investigate(near());$('notebook').onclick=notebook;$('talk').onclick=talk;$('deduce').onclick=deduce;$('save').onclick=()=>{write();toast('Progresso salvo neste navegador.')} ;$('reset').onclick=()=>modal('Reiniciar investigação?','Seu progresso local da fase de teste será apagado.',[['Sim, reiniciar',fresh],['Cancelar',hide]]);
document.addEventListener('keydown',e=>{if(!closed)return;if(['ArrowLeft','ArrowRight','a','d','A','D','e','E'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')dir=-1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')dir=1;if(e.key.toLowerCase()==='e')investigate(near())});document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))dir=0});for(let [id,v] of [['left',-1],['right',1]]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=v;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>dir=0);b.addEventListener('pointercancel',()=>dir=0)}
let last=performance.now();function loop(t){const dt=Math.min(40,t-last);last=t;if(closed&&dir){x+=dir*dt*.025;update()}requestAnimationFrame(loop)}requestAnimationFrame(loop);update();if(resume()){update();modal('Bem-vindo de volta a Salem','O caderno ainda está aberto. Deseja continuar sua investigação?', [['Continuar',hide],['Recomeçar',fresh]])}else intro();
})();
</script></body></html>
