const salemMap=new Image();let salemMapReady=false;salemMap.onload=()=>{salemMapReady=true};salemMap.onerror=()=>{salemMapReady=false};salemMap.src='./assets/maps/salem-ground-map.png';

const tileSize=84;
function stoneTile(wx,wy,kind){
 const seed=(Math.floor(wx/tileSize)*811+Math.floor(wy/tileSize)*319+991)|0;
 const rnd=(n)=>{const v=Math.sin(seed*0.0003+n*98.31)*43758.5453;return v-Math.floor(v)};
 let colors=kind==='stone'?['#403947','#514552','#67505a','#4a4050']:kind==='brick'?['#55323a','#673b3c','#45323c','#70473f']:['#393039','#554037','#624b3b','#4c403a'];
 rect(wx,wy,tileSize,tileSize,kind==='dirt'?'#302b30':'#221e28');
 if(kind==='dirt'){for(let k=0;k<17;k++){let px=wx+rnd(k)*tileSize,py=wy+rnd(k+40)*tileSize;rect(px,py,4+rnd(k+90)*12,2+rnd(k+30)*8,colors[Math.floor(rnd(k+100)*colors.length)])}}
 else for(let row=0;row<4;row++)for(let col=0;col<3;col++){let xx=wx+col*29+(row%2)*-11, yy=wy+row*22;rect(xx+2,yy+2,26,18,colors[Math.floor(rnd(row*9+col)*colors.length)]);rect(xx+3,yy+3,21,2,'#a17b6544');}

}
function ground(){
 if(salemMapReady){
  rect(0,0,sw,sh,'#100f19');

  c.drawImage(salemMap,origin.x,origin.y,world.w,world.h);

 }
 rect(0,0,sw,sh,'#100f19');const a=screen(0,0);
 c.save();c.beginPath();c.rect(Math.max(0,a.x),Math.max(0,a.y),Math.min(sw,world.w+a.x),Math.min(sh,world.h+a.y));c.clip();
 const area=[{x:0,y:765,w:world.w,h:400,kind:'stone'},{x:1130,y:0,w:270,h:world.h,kind:'stone'},{x:0,y:1000,w:world.w,h:90,kind:'brick'}];

 for(let yy=minY;yy<maxY;yy+=tileSize)for(let xx=minX;xx<maxX;xx+=tileSize){
   const mx=xx+tileSize/2,my=yy+tileSize/2;

 }

}

function render(){cam.x+=(player.x-cam.x)*.12;cam.y+=(player.y-cam.y)*.12;ground();const actors=[...blocks.map(b=>({y:b.y,kind:'b',v:b})),...people.map(p=>({y:p.y,kind:'p',v:p})),{y:player.y,kind:'hero',v:player}];actors.sort((a,b)=>a.y-b.y).forEach(a=>a.kind==='b'?box(a.v):person(a.v,a.kind==='hero'));let n=near();$('tip').textContent=n&&n.d<130?'Pressione E / Interagir: '+n.name:'Explore as ruas para encontrar edifícios e moradores';$('status').textContent='📍 Centro de Salem · Observações: '+notes.size+' · '+Math.floor(minute/60%24).toString().padStart(2,'0')+':'+Math.floor(minute%60).toString().padStart(2,'0')}

{title:'Salem e os julgamentos',body:'Os julgamentos por acusações de bruxaria ocorreram em 1692–1693 na Massachusetts colonial. Pessoas reais foram perseguidas, presas e mortas; a narrativa sobrenatural deste jogo é ficcional.',source:'https://salemwitchmuseum.com/2023/05/12/salem-witch-trials-of-1692/',kind:'Contexto histórico'},

function archivePuzzle(){if(notes.has('Enigma: cronologia'))return modal('Arquivo — cronologia','<p>Você já organizou a cronologia corretamente. O registro histórico foi adicionado ao caderno.</p>');modal('🗃️ O Enigma das Três Épocas','<p>O arquivista misturou três fichas. Qual sequência histórica está correta?</p><p><b>A:</b> julgamentos de Salem (1692) • <b>B:</b> início de Derby Wharf (1762) • <b>C:</b> instituição do parque histórico (1938).</p>',[['A → B → C',()=>{notes.add('Enigma: cronologia');notes.add('História: 1692, 1762, 1938');save();modal('✓ Arquivo restaurado','<p>Correto! Os julgamentos de 1692 precedem o desenvolvimento de Derby Wharf em 1762; o sítio histórico marítimo foi estabelecido em 1938.</p><p>Silas: “Finalmente uma sequência em que ninguém tentou condenar o calendário.”</p>')}],['B → A → C',()=>modal('Silas — Um detalhe inconveniente','<p>“O cais teria de existir antes de 1692? Reveja as datas, meu caro.”</p>',[['Tentar novamente',archivePuzzle]])],['C → A → B',()=>modal('Silas — O tempo protesta','<p>“Um parque histórico não poderia existir antes dos eventos que recorda.”</p>',[['Tentar novamente',archivePuzzle]])]])}

function caseBoard(){let a=notes.has('Enigma: frequência'),b=notes.has('Enigma: cronologia'),d=notes.has('Conversa: Edgar');modal('🧩 Casos em Salem','<p><b>Arquivo 001 — A Voz das 3h13</b></p><p>Converse com Edgar: '+(d?'✓':'○')+'<br>Reconstrua a frequência na rádio: '+(a?'✓':'○')+'<br>Organize as épocas no arquivo: '+(b?'✓':'○')+'</p><p>O objetivo é estabelecer conexões sem confundir as evidências do caso fictício com o estudo da história real.</p>',[['Apresentar dedução',()=>{if(a&&b&&d){notes.add('Caso 001: hipótese fundamentada');save();modal('⚖️ Dedução concluída','<p>A voz da rádio aponta para um enigma, mas nenhuma prova demonstra ser um fenômeno sobrenatural. O arquivo revela que Salem possui uma história muito maior que uma única narrativa.</p><p>Silas: “Toda cidade tem fantasmas. Nem todos são feitos de ectoplasma.”</p>')}else modal('Silas — Faltam peças','<p>“Uma boa hipótese precisa de pistas, não de entusiasmo.”</p>')}],['Voltar à cidade',close]])}
function action(){if(open)return;let n=near();if(!n||n.d>130)return;if(n.kind==='npc'){notes.add('Conversa: '+n.name);save();modal(n.name,'<p>“'+n.v.talk+'”</p>')}else{let p=prop[n.v.type];let actions=[[p[0],()=>{notes.add(p[0]);save();modal(p[0],'<p>'+p[1]+'</p>')}]];if(n.v.type==='archive')actions.push(['🧩 Reconstruir cronologia',archivePuzzle]);if(n.v.type==='radio')actions.push(['🎷 Decifrar a frequência',radioPuzzle]);if(n.v.type==='museum')actions.push(['📜 Consultar história de Salem',history]);actions.push(['Sair',close]);modal(n.name,'<p>Você entrou em '+n.name+'. A investigação oferece diferentes atividades e informações históricas.</p>',actions)}}
function save(){localStorage.setItem(saveId,JSON.stringify({x:player.x,y:player.y,notes:[...notes],minute}))}function load(){try{const v=JSON.parse(localStorage.getItem(saveId));if(v){player.x=v.x;player.y=v.y;notes=new Set(v.notes);minute=v.minute||0}}catch{}}
$('interact').onclick=action;$('codex').onclick=history;$('cases').onclick=caseBoard;$('book').onclick=()=>modal('Caderno de Silas','<p>'+([...notes].map(t=>'✦ '+t).join('<br>')||'Ainda não há evidências.')+'</p>');$('save').onclick=()=>{save();modal('Progresso salvo','Sua posição e descobertas foram salvas neste navegador.')};$('map').onclick=()=>modal('Mapa de Salem','<p>Setor explorável em perspectiva 2,5D. A posição e a arquitetura são protótipos fictícios, não cartografia real.</p><p>'+blocks.map(b=>'• '+b.name).join('<br>')+'</p>');const translate={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(translate[k]){keys.add(translate[k]);e.preventDefault()}if(k==='e')action();if(k==='escape'&&open)close()});addEventListener('keyup',e=>{const k=translate[e.key.toLowerCase()];if(k)keys.delete(k)});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});b.addEventListener('pointerup',()=>keys.delete(k));b.addEventListener('pointercancel',()=>keys.delete(k))});
let prev=performance.now();function loop(t){spriteClock=t;const dt=Math.min(40,t-prev);prev=t;if(!open){let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up')),mag=Math.hypot(dx,dy)||1;dx/=mag;dy/=mag;if(dx||dy){const vertical=dy<-.35?'back':dy>.35?'front':'';const horizontal=dx<-.35?'left':dx>.35?'right':'';player.face=vertical&&horizontal?vertical+'-'+horizontal:vertical||horizontal}let speed=210*dt/1000,nx=player.x+dx*speed,ny=player.y+dy*speed;if(walkable(nx,player.y))player.x=nx;if(walkable(player.x,ny))player.y=ny;minute+=dt*.0008;people.forEach((p,i)=>{let ax=p.homeX+Math.sin(t/2300+i*3)*35,ay=p.homeY+Math.cos(t/2400+i)*24;if(walkable(ax,ay)){p.x=ax;p.y=ay}})}render();requestAnimationFrame(loop)}load();cam.x=player.x;cam.y=player.y;modal('Salem em profundidade','<p>Esta é uma nova experiência de navegação: Silas pode caminhar para frente, trás, esquerda e direita. A câmera acompanha seu percurso e os personagens se movem pelas ruas.</p><p><b>Teste técnico:</b> gráficos vetoriais temporários, fachadas tridimensionais simuladas e interiores ainda representados por menus. Não é uma reconstrução geográfica fiel da Salem real.</p>',[['Explorar Salem',close]]);requestAnimationFrame(loop);
})();</script></body></html>
