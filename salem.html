<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silas Crowe — Salem Aberta</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080e;color:#ead2a5;font-family:Georgia,serif}button{cursor:pointer;border:1px solid #a97b48;background:#281521;color:#f4d6a1;padding:9px 13px;border-radius:7px;font:inherit}button:hover{background:#5a2536}header{height:57px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:#1c0d19;border-bottom:2px solid #9a7040}header b{color:#f4c477;letter-spacing:2px}header a{color:#ddb577;font-size:13px}#wrap{position:relative;width:100%;height:calc(100dvh - 119px);min-height:350px;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#14111c}#hud{position:absolute;top:11px;left:11px;padding:10px 13px;background:#110e18e8;border:1px solid #8c683c;border-radius:8px;font:13px sans-serif;max-width:75%;pointer-events:none}#prompt{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;background:#180d1fe8;border:1px solid #b88953;border-radius:10px;padding:8px 12px;font-size:14px}#controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;gap:10px;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;touch-action:none;font-size:20px;background:#251622dc;min-width:53px}#controls .group{display:flex;gap:9px}footer{height:62px;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}footer button{font-size:13px;padding:7px 12px}#modal{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:15px;background:#07060bcc}#modal.on{display:flex}.panel{border:2px solid #bd8e4f;background:linear-gradient(130deg,#301825,#100e19);padding:20px;max-width:680px;width:100%;max-height:94%;overflow:auto;border-radius:12px;box-shadow:0 0 55px #000}.panel h2{color:#f5cb88;margin-top:0}.panel p{line-height:1.55}.choices{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.choices button{flex:1 1 160px}#map{height:250px;width:100%;position:relative;background:#1d1b26;border:1px solid #90683f;border-radius:9px;overflow:hidden}#map .line{position:absolute;top:47%;width:95%;left:2%;border-top:5px solid #9d7043}#map button{position:absolute;transform:translate(-50%,-50%);border-radius:20px;padding:5px 8px;font:11px sans-serif}#map .here{outline:3px solid #c2e9ee}@media(max-width:640px){header{font-size:13px}#prompt{max-width:90%;white-space:normal;bottom:78px;font-size:12px}footer{height:auto;min-height:62px}#wrap{height:calc(100dvh - 129px)}}
</style></head><body><header><b>♬ SILAS CROWE • SALEM ABERTA</b><a href="./index.html">↩ Abertura / Caso 001</a></header><div id="wrap"><canvas id="view"></canvas><div id="hud"></div><div id="prompt"></div><div id="controls"><div class="group"><button id="left" aria-label="Mover esquerda">◀</button><button id="right" aria-label="Mover direita">▶</button></div><div class="group"><button id="act">✦</button><button id="mapBtn">🗺️</button></div></div><div id="modal"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="choices" id="choices"></div></div></div></div><footer><button id="journal">📓 Caderno</button><button id="case">🔎 Caso</button><button id="save">💾 Salvar</button><button id="reset">↻ Reiniciar</button><button id="music">🎷 Jazz: ligar</button></footer><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d'),W=6400,ground=.79,store='silas-open-salem-v1';let x=270,face=1,held={left:false,right:false},inside=null,paused=false,seen=new Set(),stage=0,clock=0,notes=[],audio=null;
const buildings=[{x:250,n:'The Midnight Crow',type:'club',w:320,c:'#33172b',roof:'#4d2531'},{x:910,n:'Sebastian Books',type:'books',w:300,c:'#2b2835',roof:'#543542'},{x:1540,n:'Salem Radio 3:13',type:'radio',w:310,c:'#302536',roof:'#542a39'},{x:2170,n:'Café das Sombras',type:'cafe',w:300,c:'#422a32',roof:'#654035'},{x:2820,n:'Arquivo Municipal',type:'archive',w:360,c:'#333143',roof:'#5d4247'},{x:3550,n:'Praça dos Sussurros',type:'square',w:230,c:'#24362d',roof:'#304d37'},{x:4300,n:'Tribunal Antigo',type:'court',w:390,c:'#36313d',roof:'#51444a'},{x:5180,n:'Cemitério Velho',type:'grave',w:350,c:'#242e32',roof:'#3b4242'},{x:5950,n:'Porto de Salem',type:'port',w:310,c:'#26373c',roof:'#3d5151'}];
const npcs=[{id:'edgar',x:1450,name:'Edgar',symbol:'🎩',about:'Operador de rádio nervoso',speech:'Eu desliguei tudo. Mas ouvi três notas e uma mulher chamando do arquivo.'},{id:'ada',x:1080,name:'Ada',symbol:'📚',about:'Livreira e colecionadora',speech:'Nem toda voz antiga é uma maldição. Às vezes é um testemunho esperando por alguém paciente.'},{id:'mrs',x:2400,name:'Madame Vale',symbol:'☕',about:'Dona do café',speech:'Quem espalha boatos costuma estar mais perto de nós do que um fantasma.'},{id:'guard',x:3000,name:'August',symbol:'🗝️',about:'Guardião do arquivo',speech:'O registro foi retirado para consulta. Há uma anotação sobre uma transmissão às 3h13.'},{id:'jules',x:3950,name:'Jules',symbol:'🎺',about:'Jazzista errante',speech:'Essa sequência? Dó, mi bemol, sol. Três notas que alguém não quis esquecer.'},{id:'ghost',x:5500,name:'Um Eco',symbol:'👻',about:'Voz no cemitério',speech:'Escute antes de me chamar de culpado.'}];
const interiors={club:{title:'The Midnight Crow',desc:'Palco de jazz, veludo vinho, taças e um microfone esperando por Silas.',items:[['🎙️ Microfone','O microfone não estava ligado no horário da transmissão.'],['🎼 Partitura','Alguém marcou as notas Dó, Mi♭ e Sol.']]},books:{title:'Sebastian Books',desc:'Uma livraria de mapas históricos, livros antigos e histórias inconvenientes.',items:[['📜 Recorte histórico','Documentos e interpretações não são a mesma coisa. Fontes precisam ser verificadas.'],['📚 Catálogo','O arquivo municipal possui registros de processos históricos.']]},radio:{title:'Salem Radio 3:13',desc:'Fitas magnéticas, tubos a vácuo e equipamentos que juram estar desligados.',items:[['📻 Fita das 3h13','A voz gravada diz: “Vocês ainda não ouviram meu testemunho.”'],['🔌 Cabo extra','Uma conexão secundária foi instalada sem identificação.']]},cafe:{title:'Café das Sombras',desc:'Café forte, sax distante e moradores que sabem demais.',items:[['📰 Jornal da madrugada','A cidade comenta uma voz misteriosa, mas nenhuma prova de origem sobrenatural existe.']]},archive:{title:'Arquivo Municipal',desc:'O lugar onde documentos guardam os fatos e as lacunas que temos de admitir.',items:[['🗃️ Índice de 1692','Registros sobre os julgamentos de Salem precisam ser investigados com respeito às vítimas reais.'],['🔖 Registro de consulta','Uma cópia de registro foi reservada para análise.']]},square:{title:'Praça dos Sussurros',desc:'Lampiões, uma fonte e música vinda de lugar nenhum.',items:[['🎷 Música distante','As três notas ecoam entre os lampiões.']]},court:{title:'Tribunal Antigo',desc:'As paredes conservam a solenidade de quem confundiu certeza e justiça.',items:[['⚖️ Inscrição','Convicção não é evidência.']]},grave:{title:'Cemitério Velho',desc:'Silêncio e respeito: as vítimas da história não são peças de um espetáculo.',items:[['🕯️ Memorial','A memória dos perseguidos exige verdade e cuidado.']]},port:{title:'Porto de Salem',desc:'O nevoeiro chega antes dos navios. Contrabaixistas tocam em bares imaginários.',items:[['⚓ Manifesto','O porto está ligado aos boatos da cidade, mas ainda faltam fatos.']]}};
function save(){localStorage.setItem(store,JSON.stringify({x,seen:[...seen],stage,clock,inside}));}
function load(){try{const d=JSON.parse(localStorage.getItem(store));if(d){x=d.x||270;seen=new Set(d.seen||[]);stage=d.stage||0;clock=d.clock||0;inside=d.inside||null}}catch{}}
function modal(title,html,buttons){paused=true;$('modal').classList.add('on');$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('choices').innerHTML='';(buttons?.length?buttons:[['Continuar',close]]).forEach(([txt,fn])=>{let b=document.createElement('button');b.textContent=txt;b.onclick=fn;$('choices').appendChild(b)})}
function close(){paused=false;$('modal').classList.remove('on');save()}
function inspect(label,info,key){seen.add(key);save();modal(label,'<p>'+info+'</p><p style="color:#bca684">✓ Observação registrada no caderno.</p>')}
function insideMenu(){const place=interiors[inside];modal('⌂ '+place.title,'<p>'+place.desc+'</p><p>O que deseja investigar?</p>',[...place.items.map(([label,desc],i)=>[label,()=>inspect(label,desc,inside+':'+i)]),['Sair para a rua',()=>{inside=null;close()}]])}
function talk(n){seen.add('npc:'+n.id);if(n.id==='edgar')stage=Math.max(stage,1);save();modal(n.name+' — '+n.about,'<p>“'+n.speech+'”</p>',[['Perguntar sobre Salem',()=>modal(n.name,'“Salem tem muitas histórias. Nem todas são verdadeiras; nenhuma merece ser julgada sem cuidado.”')],['Encerrar conversa',close]])}
function closest(){let picks=[...buildings.map(b=>({x:b.x,kind:'building',o:b})),...npcs.map(n=>({x:n.x,kind:'npc',o:n}))];return picks.map(p=>({...p,d:Math.abs(x-p.x)})).sort((a,b)=>a.d-b.d)[0]}
function action(){if(inside)return insideMenu();let p=closest();if(p.d>135)return;if(p.kind==='building'){inside=p.o.type;insideMenu()}else talk(p.o)}
function journal(){modal('📓 Caderno de Silas','<p><b>Observações registradas:</b> '+seen.size+'</p>'+(seen.size?[...seen].map(z=>'<p>✦ '+z.replace('npc:','Conversa: ').replace(':',' • objeto ')+'</p>').join(''):'<p>Explore e investigue para reunir as primeiras evidências.</p>'),[['Fechar',close]])}
function caseMenu(){let requirements=['radio:0','radio:1','npc:edgar','archive:0'];let count=requirements.filter(z=>seen.has(z)).length;modal('🔎 Arquivo 001 — A Voz das 3h13','<p>A mensagem misteriosa surgiu num rádio desligado. Descubra o que sabemos e, principalmente, o que ainda não podemos afirmar.</p><p>Progresso: '+count+'/4 evidências fundamentais.</p>',[['Apresentar hipótese',()=>{if(count<4)modal('Ainda faltam provas','Investigue a fita e o cabo na rádio, converse com Edgar e consulte o arquivo.');else {stage=2;save();modal('Dedução fundamentada','A gravação existe, uma conexão anônima foi instalada e há relação com documentos antigos. A origem sobrenatural ainda é uma hipótese — não um fato. <p>✦ Primeira investigação urbana concluída. Salem permanece aberta para exploração.</p>')}}],['Voltar à cidade',close]])}
function mapMenu(){let marks=buildings.map((b,i)=>{let left=5+(b.x/W)*90;return '<button style="left:'+left+'%;top:'+(35+(i%3)*12)+'%" class="'+(Math.abs(x-b.x)<230?'here':'')+'" data-idx="'+i+'">'+['🎷','📚','📻','☕','🗃️','🌳','⚖️','🕯️','⚓'][i]+'</button>'}).join('');modal('🗺️ Salem — Mapa de exploração','<p>Uma Salem ficcional inspirada em sua arquitetura e memória. Este mapa é esquemático, não um mapa geográfico real.</p><div id="map"><div class="line"></div>'+marks+'</div><p>Você está em: '+district()+'</p>');document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>modal(buildings[+b.dataset.idx].n,'<p>'+interiors[buildings[+b.dataset.idx].type].desc+'</p><p>Para chegar lá, caminhe pelas ruas.</p>',[['Voltar ao mapa',mapMenu]]))}
function district(){return buildings.reduce((best,b)=>Math.abs(b.x-x)<Math.abs(best.x-x)?b:best).n}
function resize(){const ratio=Math.min(2,window.devicePixelRatio||1);canvas.width=canvas.clientWidth*ratio;canvas.height=canvas.clientHeight*ratio}window.addEventListener('resize',resize);resize();
function rect(X,Y,w,h,color){ctx.fillStyle=color;ctx.fillRect(X,Y,w,h)}function text(s,X,Y,size=14,color='#f5cc8e'){ctx.fillStyle=color;ctx.font=size+'px Georgia';ctx.textAlign='center';ctx.fillText(s,X,Y)}
function render(){const vw=canvas.width,vh=canvas.height,scale=vw/960,base=vh*ground,cam=Math.max(0,Math.min(W-960,x-480)),world=v=>Math.round((v-cam)*scale),day=(clock/60)%24;
let grd=ctx.createLinearGradient(0,0,0,vh);grd.addColorStop(0,'#140f26');grd.addColorStop(.72,'#58293b');grd.addColorStop(1,'#b46a4b');rect(0,0,vw,vh,grd);ctx.beginPath();ctx.arc(vw*.77,vh*.14,39*scale,0,Math.PI*2);ctx.fillStyle='#f2bd75';ctx.fill();ctx.shadowColor='#f2bd75';ctx.shadowBlur=32*scale;ctx.fill();ctx.shadowBlur=0;
for(let i=0;i<120;i++){let px=((i*327+77-cam*.12)%(W/3)+W/3)%(W/3);let X=(px/(W/3))*vw;rect(X,(i*97%50)*scale,1.2*scale,1.2*scale,'#e9bc83')}
for(let i=0;i<90;i++){let px=world(i*93),ht=(70+(i*41)%120)*scale;rect(px,base-ht,85*scale,ht,'#151321');rect(px+20*scale,base-ht+26*scale,8*scale,22*scale,'#cb8a53')}
rect(0,base,vw,vh-base,'#34232a');rect(0,base+6*scale,vw,5*scale,'#9c714e');
for(let i=0;i<100;i++){let px=world(i*85),py=base+32*scale;rect(px,py,65*scale,2*scale,'#6f4650')}
for(const b of buildings){let bx=world(b.x-b.w/2),bw=b.w*scale;if(bx>vw+200||bx+bw<-200)continue;let bh=(b.type==='court'?300:b.type==='archive'?280:220)*scale;rect(bx,base-bh,bw,bh,b.c);ctx.beginPath();ctx.moveTo(bx-16*scale,base-bh);ctx.lineTo(bx+bw/2,base-bh-65*scale);ctx.lineTo(bx+bw+16*scale,base-bh);ctx.closePath();ctx.fillStyle=b.roof;ctx.fill();rect(bx+bw*.41,base-102*scale,bw*.18,102*scale,'#140d17');rect(bx+bw*.44,base-87*scale,bw*.12,82*scale,'#624336');for(let j=0;j<3;j++){rect(bx+(30+j*(b.w-60)/3)*scale,base-bh+48*scale,37*scale,70*scale,'#c98c50');rect(bx+(44+j*(b.w-60)/3)*scale,base-bh+48*scale,5*scale,70*scale,'#301d2b')}text(b.n,bx+bw/2,base-bh+22*scale,18*scale,'#f1c87c');text('ENTRAR  ↵',bx+bw/2,base-110*scale,12*scale,'#f3d1a0')}
for(let i=0;i<60;i++){const px=world(i*115+30);rect(px,base-55*scale,5*scale,55*scale,'#17121a');ctx.beginPath();ctx.arc(px+2*scale,base-55*scale,9*scale,0,Math.PI*2);ctx.fillStyle='#f1b561';ctx.shadowColor='#e59a48';ctx.shadowBlur=20*scale;ctx.fill();ctx.shadowBlur=0}
for(const n of npcs){let nx=world(n.x);if(nx<-90||nx>vw+90)continue;ctx.beginPath();ctx.ellipse(nx,base-13*scale,13*scale,6*scale,0,0,7);ctx.fillStyle='#0009';ctx.fill();rect(nx-11*scale,base-69*scale,22*scale,55*scale,'#3c394d');ctx.beginPath();ctx.arc(nx,base-81*scale,15*scale,0,7);ctx.fillStyle='#d5a68f';ctx.fill();text(n.symbol,nx,base-111*scale,20*scale);text(n.name,nx,base-133*scale,15*scale)}
let sx=world(x);ctx.save();ctx.translate(sx,base-15*scale);ctx.scale(scale*face,scale);ctx.fillStyle='#ede4df';ctx.beginPath();ctx.moveTo(-8,-95);ctx.quadraticCurveTo(-64,-150,-59,-38);ctx.lineTo(-15,-60);ctx.moveTo(8,-95);ctx.quadraticCurveTo(64,-150,59,-38);ctx.lineTo(15,-60);ctx.fill();rect(-18,-89,36,65,'#20131b');rect(-13,-87,26,51,'#8d233b');rect(-16,-24,13,24,'#17151d');rect(3,-24,13,24,'#17151d');ctx.fillStyle='#eac4ab';ctx.beginPath();ctx.ellipse(0,-113,17,23,0,0,7);ctx.fill();ctx.fillStyle='#12101a';ctx.beginPath();ctx.moveTo(-17,-116);ctx.lineTo(-16,-140);ctx.lineTo(16,-137);ctx.lineTo(19,-115);ctx.lineTo(3,-127);ctx.fill();ctx.strokeStyle='#161018';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-12,-131);ctx.quadraticCurveTo(-33,-157,-24,-165);ctx.moveTo(12,-131);ctx.quadraticCurveTo(33,-157,24,-165);ctx.stroke();rect(-11,-116,9,2,'#3899ca');rect(3,-116,9,2,'#3899ca');ctx.restore();
$('hud').innerHTML='📍 '+district()+'<br>🕰️ '+String(Math.floor(day)).padStart(2,'0')+':'+String(Math.floor(clock%60)).padStart(2,'0')+' · 🔎 '+seen.size+' observações<br>↔ A/D ou setas • E interagir • M mapa';let p=closest();$('prompt').textContent=inside?'Dentro de '+interiors[inside].title+' — E para investigar':p.d<135?'E / ✦ — '+(p.kind==='npc'?'Conversar com '+p.o.name:'Entrar: '+p.o.n):'Explore Salem: ruas, moradores, locais e mistérios';}
let last=performance.now();function loop(now){let dt=Math.min(50,now-last);last=now;if(!paused&&!inside){let dir=Number(held.right)-Number(held.left);if(dir){x=Math.max(30,Math.min(W-35,x+dir*dt*.39));face=dir}clock+=dt*.0009}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.addEventListener('keydown',e=>{if($('modal').classList.contains('on')){if(e.key==='Escape')close();return}let k=e.key.toLowerCase();if(['a','arrowleft'].includes(k))held.left=true;if(['d','arrowright'].includes(k))held.right=true;if(k==='e'||k==='enter')action();if(k==='m')mapMenu();if(['a','d','arrowleft','arrowright',' '].includes(k))e.preventDefault()});document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['a','arrowleft'].includes(k))held.left=false;if(['d','arrowright'].includes(k))held.right=false});for(let [id,k] of [['left','left'],['right','right']]){let b=$(id);b.addEventListener('pointerdown',e=>{held[k]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>held[k]=false);b.addEventListener('pointercancel',()=>held[k]=false)}$('act').onclick=action;$('mapBtn').onclick=mapMenu;$('journal').onclick=journal;$('case').onclick=caseMenu;$('save').onclick=()=>{save();modal('Progresso salvo','Seu caminho por Salem, suas conversas e pistas foram registrados neste navegador.')} ;$('reset').onclick=()=>modal('Recomeçar a cidade?','Isso apagará a posição e as pistas salvas desta demonstração.',[['Apagar e recomeçar',()=>{localStorage.removeItem(store);x=270;seen.clear();stage=0;inside=null;clock=0;close()}],['Cancelar',close]]);$('music').onclick=()=>{if(audio){audio.pause();audio=null;$('music').textContent='🎷 Jazz: ligar';return}audio=new Audio();let A=window.AudioContext||window.webkitAudioContext;try{let ac=new A(), notes=[130.81,155.56,196,233.08],t=ac.currentTime;for(let i=0;i<28;i++){let osc=ac.createOscillator(),gain=ac.createGain();osc.type=i%4?'sine':'triangle';osc.frequency.value=notes[i%notes.length]*(i%7===0?2:1);gain.gain.setValueAtTime(0,t+i*.32);gain.gain.linearRampToValueAtTime(.055,t+i*.32+.035);gain.gain.exponentialRampToValueAtTime(.001,t+i*.32+.28);osc.connect(gain);gain.connect(ac.destination);osc.start(t+i*.32);osc.stop(t+i*.32+.3)}$('music').textContent='🎷 Vinheta tocando';setTimeout(()=>$('music').textContent='🎷 Jazz: ligar',9500)}catch{}};load();modal('🌙 Salem Aberta — Primeira Construção','Bem-vindo ao primeiro esqueleto de uma Salem contínua, com nove locais, seis habitantes e investigação distribuída pela cidade.<p><b>Esta versão é técnica:</b> a arte urbana é gerada em Canvas e Silas é um desenho provisório. Ela ainda não representa uma reprodução fiel da geografia real de Salem nem o mundo aberto final.</p><p>Explore caminhando, entre nos prédios e investigue o Arquivo 001.</p>',[['Adentrar Salem',close]]);
})();
</script></body></html>
